apiVersion: v1
kind: Service
metadata:
  name: kafka-poc-headless
  namespace: midlleware
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-poc
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-poc-bootstrap
  namespace: midlleware
spec:
  type: ClusterIP
  selector:
    app: kafka-poc
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
