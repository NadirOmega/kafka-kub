# KRaft cluster ID is an identifier, not a password.
# Keep this exact value when redeploying against an existing initialized PVC.
# If your Kafka PVC already contains meta.properties, do NOT change its cluster.id.
apiVersion: v1
kind: Secret
metadata:
  name: kafka-poc-cluster-id
  namespace: midlleware
type: Opaque
stringData:
  CLUSTER_ID: aeThCtFrQq6fI-rM02oVSw
