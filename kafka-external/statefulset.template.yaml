# DO NOT APPLY DIRECTLY: use kafka-external/prepare.sh to inject the Route host.
# POC: extra TLS listener is protected by required mTLS client certificates.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-poc
  namespace: midlleware
spec:
  serviceName: kafka-poc-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka-poc
  template:
    metadata:
      labels:
        app: kafka-poc
    spec:
      containers:
        - name: kafka
          # Immutable reference: verified successfully pulled in this cluster.
          image: image-registry.openshift-image-registry.svc:5000/midlleware/cp-kafka@sha256:a4787948e5cf6da543fd639f62ac0a60b74d20af18a08a2b4367a087e5945107
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: kafka-tls
              containerPort: 9094
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-poc-cluster-id
                  key: CLUSTER_ID
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka-poc-0.kafka-poc-headless.midlleware.svc:9092,EXTERNAL://EXTERNAL_HOST_PLACEHOLDER:443"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SSL"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-poc-0.kafka-poc-headless.midlleware.svc:9093"
            # TLS for external clients only; internal Kafka remains PLAINTEXT.
            - name: KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEYSTORE_LOCATION
              value: /etc/kafka/external-tls/server.p12
            - name: KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-poc-external-tls
                  key: keystore-password
            - name: KAFKA_LISTENER_NAME_EXTERNAL_SSL_TRUSTSTORE_TYPE
              value: PEM
            - name: KAFKA_LISTENER_NAME_EXTERNAL_SSL_TRUSTSTORE_LOCATION
              value: /etc/kafka/external-tls/ca.crt
            - name: KAFKA_LISTENER_NAME_EXTERNAL_SSL_CLIENT_AUTH
              value: required
            # Separate Kafka logs from the filesystem root (ext4 lost+found).
            # Kafka storage formatter creates this directory on the existing PVC.
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/kafka-logs"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: external-tls
              mountPath: /etc/kafka/external-tls
              readOnly: true
      volumes:
        - name: external-tls
          secret:
            secretName: kafka-poc-external-tls
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
