# EXTERNAL TLS variant of the existing single broker POC StatefulSet.
# Apply ONLY after kafka-external-tls Secret exists (scripts/create-tls-secret.sh).
# Keeps the SAME cluster ID, node ID, services, volumeClaimTemplates and PVC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-poc
  namespace: midlleware
spec:
  serviceName: kafka-poc-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka-poc
  template:
    metadata:
      labels:
        app: kafka-poc
    spec:
      containers:
        - name: kafka
          # Immutable reference: verified successfully pulled in this cluster.
          image: image-registry.openshift-image-registry.svc:5000/midlleware/cp-kafka@sha256:a4787948e5cf6da543fd639f62ac0a60b74d20af18a08a2b4367a087e5945107
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: kafka-tls
              containerPort: 9094
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-poc-cluster-id
                  key: CLUSTER_ID
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka-poc-0.kafka-poc-headless.midlleware.svc:9092,EXTERNAL://kafka-poc-external-midlleware.apps.dev-app-hub.0k6e.p1.openshiftapps.com:443"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SSL"
            # PKCS12 cert and CA trust; only EXTERNAL listener requires client cert.
            # Supply settings directly, including because listener name is EXTERNAL (not SSL).
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /etc/kafka/secrets/kafka.keystore.p12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-external-tls
                  key: store-password
            - name: KAFKA_SSL_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-external-tls
                  key: store-password
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /etc/kafka/secrets/kafka.truststore.p12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-external-tls
                  key: store-password
            - name: KAFKA_LISTENER_NAME_EXTERNAL_SSL_CLIENT_AUTH
              value: required
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-poc-0.kafka-poc-headless.midlleware.svc:9093"
            # Separate Kafka logs from the filesystem root (ext4 lost+found).
            # Kafka storage formatter creates this directory on the existing PVC.
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/kafka-logs"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: kafka-external-tls
              mountPath: /etc/kafka/secrets
              readOnly: true
      volumes:
        - name: kafka-external-tls
          secret:
            secretName: kafka-external-tls
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
