# POC ONLY: the official Kafbat UI image is not verified as Red Hat UBI.
# Create the kafbat-ui-auth Secret before applying this Deployment or its Pod will not start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: midlleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: image-registry.openshift-image-registry.svc:5000/midlleware/kafbat-ui:a0aaba3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: KAFKA_CLUSTERS_0_NAME
              value: kafka-poc
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka-poc-bootstrap:9092
            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              value: http://schema-registry:8081
            - name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME
              value: connect-poc
            - name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS
              value: http://kafka-connect:8083
            # Login form for exposed UI; credentials are referenced from a Secret.
            - name: AUTH_TYPE
              value: LOGIN_FORM
            - name: SPRING_SECURITY_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: kafbat-ui-auth
                  key: username
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafbat-ui-auth
                  key: password
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
