# Apply separately AFTER Kafbat UI login authentication has been verified.
# OpenShift will assign a host when spec.host is omitted.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kafka-ui
  namespace: midlleware
spec:
  to:
    kind: Service
    name: kafka-ui
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
